modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="http://www.kodevelopment.nl/minecraft/varied-commodities"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="http://www.kodevelopment.nl/minecraft/varied-commodities"
authors="${mod_authors}"
credits="Original mod by Noppes (kodevelopment.nl). Licensed under Creative Commons Attribution-NonCommercial 3.0 Unported (CC BY-NC 3.0). This is a faithful, non-commercial port to Minecraft 1.20.1."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},1.21)"
    ordering="NONE"
    side="BOTH"
